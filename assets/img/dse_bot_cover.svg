<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181c24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12151b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glow Accents -->
  <circle cx="300" cy="200" r="180" fill="#f97316" fill-opacity="0.06" filter="blur(60px)"/>
  <circle cx="900" cy="450" r="220" fill="#06b6d4" fill-opacity="0.05" filter="blur(80px)"/>

  <!-- Top Title Header -->
  <g transform="translate(80, 75)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f97316" letter-spacing="3">MULTI-AGENT ADMISSIONS &amp; COUNSELING</text>
    <text y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" fill="#f4f4f5" letter-spacing="-0.5">DSE Bot Architecture</text>
    <text y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#71717a">Deterministic JUPAS Weighting Engine // Empathetic LLM Guidance // GCP Cloud Run</text>
  </g>

  <!-- Agent 1: Router & Intent Classifier -->
  <g transform="translate(80, 200)">
    <rect width="280" height="380" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#f97316"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">LAYER 01 : INPUT</text>
    <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">Query &amp; Grade Router</text>
    <text x="20" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#a1a1aa">Classifies student input intent</text>

    <!-- Visual Router Decision -->
    <rect x="20" y="125" width="240" height="60" rx="10" fill="#0f1117" stroke="#27272a"/>
    <text x="35" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb923c">Incoming HKDSE Grades</text>
    <text x="35" y="170" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">CHI: 5* | ENG: 4 | MATH: 5 | ELEC: 5, 4</text>

    <!-- Branch A -->
    <path d="M 20 220 L 260 220" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="20" y="240" width="240" height="50" rx="8" fill="#181c24" stroke="#f97316" stroke-opacity="0.3"/>
    <text x="35" y="262" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fdba74">Branch A: Math Query</text>
    <text x="35" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a1a1aa">Deterministic Python Formula Engine</text>

    <!-- Branch B -->
    <rect x="20" y="305" width="240" height="50" rx="8" fill="#181c24" stroke="#06b6d4" stroke-opacity="0.3"/>
    <text x="35" y="327" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#67e8f9">Branch B: Emotional Support</text>
    <text x="35" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#a1a1aa">Empathetic Counseling Agent</text>
  </g>

  <!-- Connectors from Router to Agents -->
  <path d="M 360 380 L 460 300" stroke="#f97316" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
  <path d="M 360 480 L 460 480" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

  <!-- Agent 2: Deterministic Python Engine -->
  <g transform="translate(460, 160)">
    <rect width="320" height="210" rx="16" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#f97316"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fdba74">AGENT A : DETERMINISTIC ENGINE</text>
    <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#f4f4f5">Zero-Hallucination Math Engine</text>
    
    <rect x="20" y="80" width="280" height="105" rx="8" fill="#0c0e12" stroke="#27272a"/>
    <text x="32" y="105" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">def calc_jupas_weighting(grades):</text>
    <text x="46" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a"># JUPAS Best 5 with 1.5x Stem multiplier</text>
    <text x="46" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e4e4e7">return grades.math * 1.5 + electives</text>
    <text x="32" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb923c">&gt;&gt; Exact Weighted Score: 38.5 (Median: 37)</text>
  </g>

  <!-- Agent 3: Empathetic Counseling Agent -->
  <g transform="translate(460, 390)">
    <rect width="320" height="190" rx="16" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#06b6d4"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#67e8f9">AGENT B : EMPATHETIC COUNSELOR</text>
    <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#f4f4f5">Crisis &amp; Psychological Guardrails</text>

    <!-- Sentiment Wave / Guardrail Box -->
    <rect x="20" y="80" width="280" height="85" rx="8" fill="#0c0e12" stroke="#27272a"/>
    <path d="M 35 115 Q 60 95, 85 115 T 135 115 T 185 115 T 235 115 T 285 115" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <text x="32" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">Tone Guardrail: Active Listening Active</text>
    <text x="32" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#67e8f9">Output: Anxiety Reduction + Sub-degree Routes</text>
  </g>

  <!-- Right: Production Deployment Node (Cloud Run + Docker) -->
  <g transform="translate(830, 200)">
    <rect width="290" height="380" rx="16" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#a855f7"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#c084fc">PRODUCTION CLOUD</text>
    <text x="20" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">Google Cloud Run</text>
    <text x="20" y="86" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">Region: asia-east1 (Hong Kong)</text>

    <!-- Cloud metrics -->
    <rect x="20" y="115" width="250" height="70" rx="10" fill="#0f1117" stroke="#27272a"/>
    <text x="35" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">CONCURRENCY &amp; AUTOSCALE</text>
    <text x="35" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#34d399">0 &gt;&gt; 1,000+ Pods</text>

    <rect x="20" y="200" width="250" height="70" rx="10" fill="#0f1117" stroke="#27272a"/>
    <text x="35" y="227" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">DOCKER CONTAINER IMAGE</text>
    <text x="35" y="250" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#e4e4e7">gcr.io/dse-bot:latest</text>

    <rect x="20" y="285" width="250" height="70" rx="10" fill="#0f1117" stroke="#27272a"/>
    <text x="35" y="312" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">PEAK AVAILABILITY</text>
    <text x="35" y="335" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f97316">DSE Results Release Day Ready</text>
  </g>

  <!-- Connectors to Cloud -->
  <path d="M 780 265 L 830 300" stroke="#f97316" stroke-width="2" opacity="0.4"/>
  <path d="M 780 485 L 830 450" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
</svg>
