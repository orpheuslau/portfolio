<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="dioBg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#181524"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1c26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12131c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#dioBg)"/>
  <rect width="1200" height="675" fill="url(#grid3)"/>

  <!-- Warm ambient glow -->
  <circle cx="200" cy="250" r="200" fill="#f59e0b" fill-opacity="0.05" filter="blur(80px)"/>
  <circle cx="950" cy="350" r="220" fill="#a855f7" fill-opacity="0.06" filter="blur(90px)"/>

  <!-- Top Title -->
  <g transform="translate(80, 75)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="3">CULTURAL HERITAGE &amp; INTERACTIVE MUSEUM KIOSK</text>
    <text y="42" font-family="'Instrument Serif', serif" font-size="38" font-style="italic" fill="#fef08a" letter-spacing="-0.5">Messengers of Hope</text>
    <text y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#e4e4e7">Catholic Diocese 80th Anniversary Exhibition AI Tour Guide</text>
    <text y="90" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717a">Archival RAG // Multilingual Docent (Cantonese / English / Mandarin) // Caritas House Kiosk</text>
  </g>

  <!-- Left: Visitor Ingestion & Intent Classifier -->
  <g transform="translate(80, 205)">
    <rect width="280" height="380" rx="16" fill="url(#cardGrad3)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#fbbf24"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fef08a">INTERACTION LAYER</text>
    <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">Kiosk &amp; Web App</text>
    <text x="20" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a1a1aa">Multilingual Visitor Query</text>

    <!-- Language classifier tabs -->
    <rect x="20" y="115" width="240" height="75" rx="8" fill="#0f1118" stroke="#27272a"/>
    <text x="32" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">Intent &amp; Language Detection</text>
    <text x="32" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e4e4e7">粤 廣東話 / EN English / 普 普通話</text>
    <text x="32" y="177" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Intent: Artifact Provenance</text>

    <rect x="20" y="205" width="240" height="155" rx="8" fill="#0f1118" stroke="#27272a"/>
    <text x="32" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">Exhibition Visitor Prompt</text>
    <text x="32" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e5e7eb">"What is the historical significance of the 1950s Caritas relief distribution chalice?"</text>
    <text x="32" y="315" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Target: Zone 3 Historical Gallery</text>
    <text x="32" y="335" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24">Persona: Warm Educational Docent</text>
  </g>

  <!-- Middle: Archival Vector Store & Guardrails -->
  <g transform="translate(390, 205)">
    <!-- Archival Vector Store -->
    <rect width="360" height="180" rx="14" fill="url(#cardGrad3)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="20" y="18" width="8" height="8" rx="4" fill="#fbbf24"/>
    <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fef08a">80-YEAR ARCHIVAL VECTOR STORE</text>
    <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#f4f4f5">Parish &amp; Diocesan Records</text>
    <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9ca3af">Ingested historical documentation (1946–2026)</text>
    
    <rect x="20" y="98" width="320" height="62" rx="8" fill="#0d1017" stroke="#27272a"/>
    <text x="32" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fcd34d">Artifact ID: #RELIC-1953-C</text>
    <text x="32" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#e5e7eb">Caritas Refugee Kitchen post-war emergency records</text>

    <!-- Theological Guardrails -->
    <g transform="translate(0, 200)">
      <rect width="360" height="180" rx="14" fill="url(#cardGrad3)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>
      <rect x="20" y="18" width="8" height="8" rx="4" fill="#a855f7"/>
      <text x="36" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#d8b4fe">SAFETY &amp; THEOLOGICAL GUARDRAILS</text>
      <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="600" fill="#f4f4f5">Curatorial Neutrality Filter</text>
      <text x="20" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#9ca3af">Enforces doctrinal accuracy &amp; historical fidelity</text>
      
      <rect x="20" y="98" width="320" height="62" rx="8" fill="#0d1017" stroke="#27272a"/>
      <text x="32" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">Strict Grounding: Zero Speculation</text>
      <text x="32" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">✓ Curatorial Verification Passed</text>
    </g>
  </g>

  <!-- Right: Multilingual Docent Kiosk Synthesis -->
  <g transform="translate(780, 205)">
    <rect width="340" height="380" rx="16" fill="url(#cardGrad3)" stroke="#27272a" stroke-width="1.5"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#34d399"/>
    <text x="36" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#6ee7b7">SYNTHESIS &amp; AUDIENCE</text>
    <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">Multilingual Docent</text>
    <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Output: Spoken Audio + Screen Display</text>

    <!-- Kiosk output card -->
    <rect x="20" y="115" width="300" height="235" rx="10" fill="#090b10" stroke="#27272a"/>
    <text x="35" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fcd34d">Docent Narrative [Cantonese HK]</text>
    
    <text x="35" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e5e7eb">「呢件展品記錄咗1950年代，</text>
    <text x="35" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e5e7eb">明愛初期為難民派發救濟物資嘅歷史，</text>
    <text x="35" y="217" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e5e7eb">象徵著教會在逆境中帶來希望嘅使命…」</text>
    
    <rect x="35" y="245" width="270" height="85" rx="8" fill="#131622" stroke="#27272a"/>
    <text x="45" y="270" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">DEPLOYMENT PROFILE</text>
    <text x="45" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#fef08a">Caritas House Exhibition Hall</text>
    <text x="45" y="310" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">Zero Kiosk Latency · 80 Years of History</text>
  </g>

  <!-- Connectors -->
  <path d="M 360 295 L 390 295" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <path d="M 360 480 L 390 480" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <path d="M 750 295 L 780 340" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <path d="M 750 480 L 780 400" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
</svg>
